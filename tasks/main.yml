---
# --------------------------------

- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-unix"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-unix"]

- name: "Create /usr/local structure"
  ansible.builtin.file:
    path: /usr/local/{{ item }}
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop: ["", "bin", "etc", "etc/bash.d", "lib"]
  become: true
  tags: ["ct-unix"]

- name: "Update /etc/hostname"
  ansible.builtin.template:
    src: etc-hostname.j2
    dest: /etc/hostname
    owner: root
    group: root
    mode: "0644"
  when: ct_container is not defined
  become: true
  tags: ["ct-unix"]

- name: "Set hostname"
  ansible.builtin.hostname:
    name: "{{ ct_hostname | default(inventory_hostname) }}"
  when: ct_container is not defined
  become: true
  tags: ["ct-unix"]

- name: "Update /etc/hosts"
  ansible.builtin.lineinfile:
    line: "{{ local_ipv4 }} {{ inventory_hostname }}"
    path: /etc/hosts
    regexp: '\d+\.\d+\.\d+\.\d+ {{ inventory_hostname }}'
    state: present
  when: local_ipv4 is defined
  become: true
  tags: ["ct-unix"]

- name: "Set timezone"
  ansible.builtin.template:
    src: timezone.j2
    dest: /etc/timezone
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ct_timezone is defined
  notify: Handler_Update_Timezone
  become: true
  tags: ["ct-unix"]

- name: "Copy over core bash include file"
  ansible.builtin.copy:
    src: core.sh
    dest: /usr/local/etc/bash.d/core.sh
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: ["ct-unix"]

